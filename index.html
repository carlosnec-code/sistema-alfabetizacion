<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Alfabetización</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #ffffff;
        }
        .btn {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #047857;
        }
        .btn-danger {
            background-color: #dc2626;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1f2937;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 20px;
            color: #9ca3af;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background-color: #374151;
            color: white;
            box-sizing: border-box;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #1f2937;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #374151;
        }
        th {
            background-color: #111827;
            color: #9ca3af;
            font-size: 12px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sistema de Alfabetización</h1>
    <h2>Directorio de Maestros y Acceso</h2>
    
    <button class="btn" onclick="openTeacherModal()">+ Registrar Maestro / Crear Acceso</button>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>DUI</th>
                <th>Nivel</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="teachers-table-body">
            <!-- Se llena dinámicamente -->
        </tbody>
    </table>
</div>

<!-- Modal Registrar Maestro -->
<div class="modal" id="teacher-modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeTeacherModal()">&times;</span>
        <h3 id="modal-title">Registrar Maestro / Crear Acceso</h3>
        <input type="hidden" id="teacher-id">
        
        <div class="form-group">
            <label for="teacher-nombre">Nombre Completo</label>
            <input type="text" id="teacher-nombre" placeholder="Nombre completo">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="teacher-email">Correo Electrónico (Login)</label>
                <input type="email" id="teacher-email" placeholder="correo@ejemplo.com">
            </div>
            <div class="form-group">
                <label for="teacher-password">Contraseña</label>
                <input type="password" id="teacher-password" placeholder="••••••">
                <small style="color: #9ca3af; font-size: 10px;">Requerido para crear nuevo acceso.</small>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="teacher-telefono">Teléfono</label>
                <input type="text" id="teacher-telefono" placeholder="12345678">
            </div>
            <div class="form-group">
                <label for="teacher-dui">DUI</label>
                <input type="text" id="teacher-dui" placeholder="12345678-9">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="teacher-nivel">Nivel Asignado</label>
                <select id="teacher-nivel">
                    <option value="1">Nivel 1</option>
                    <option value="2">Nivel 2</option>
                    <option value="3">Nivel 3</option>
                </select>
            </div>
            <div class="form-group">
                <label for="teacher-rol-nivel">Rol de Nivel</label>
                <select id="teacher-rol-nivel">
                    <option value="Líder de nivel">Líder de nivel</option>
                    <option value="Maestro">Maestro</option>
                </select>
            </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button class="btn" style="background-color: #4b5563;" onclick="closeTeacherModal()">Cancelar</button>
            <button class="btn" onclick="saveTeacher()">Guardar y Dar Acceso</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ REEMPLAZA "TU_NUEVA_CLAVE_ANON_AQUI" CON TU CLAVE ANON DE SUPABASE (Obtenida en Project Settings > API)
    const SUPABASE_URL = "https://cegulltqwhgovouncvfc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_DFVGrIa0apWrXc2VDOfStg_5SWP2mqe"; 

    // Inicialización del cliente Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Cargar datos al iniciar
    document.addEventListener('DOMContentLoaded', fetchMaestros);

    // Función para obtener la lista de maestros
    async function fetchMaestros() {
        const { data, error } = await supabaseClient
            .from('maestros')
            .select('*')
            .eq('estado', 'Activo');

        if (error) {
            console.error("Error al obtener maestros:", error.message);
            return;
        }

        const tbody = document.getElementById('teachers-table-body');
        tbody.innerHTML = '';

        data.forEach(teacher => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${teacher.nombre || ''}</td>
                <td>${teacher.email || ''}</td>
                <td>${teacher.telefono || ''}</td>
                <td>${teacher.dui || ''}</td>
                <td>Nivel ${teacher.nivel_id || ''}</td>
                <td>${teacher.rol_nivel || ''}</td>
                <td>
                    <button class="btn btn-danger" style="padding: 5px 10px; font-size: 12px;" onclick="deleteTeacher('${teacher.id}')">Borrar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Modal Control
    function openTeacherModal() {
        document.getElementById('teacher-id').value = '';
        document.getElementById('teacher-nombre').value = '';
        document.getElementById('teacher-email').value = '';
        document.getElementById('teacher-password').value = '';
        document.getElementById('teacher-telefono').value = '';
        document.getElementById('teacher-dui').value = '';
        document.getElementById('teacher-modal').style.display = 'flex';
    }

    function closeTeacherModal() {
        document.getElementById('teacher-modal').style.display = 'none';
    }

    // Guardar Maestro y Crear Usuario en Auth
    async function saveTeacher() {
        const id = document.getElementById('teacher-id').value;
        const email = document.getElementById('teacher-email').value;
        const password = document.getElementById('teacher-password').value;
        const nombre = document.getElementById('teacher-nombre').value;
        const telefono = document.getElementById('teacher-telefono').value;
        const dui = document.getElementById('teacher-dui').value;
        const nivel_id = document.getElementById('teacher-nivel').value;
        const rol_nivel = document.getElementById('teacher-rol-nivel').value;

        let authUserId = id;

        // Crear nuevo usuario mediante signUp si es un maestro nuevo
        if (!id && password) {
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (authError) {
                alert("Error al crear usuario de acceso: " + authError.message);
                return;
            }
            if (authData?.user) {
                authUserId = authData.user.id;
            }
        }

        const teacherData = {
            nombre,
            email,
            telefono,
            dui,
            nivel_id,
            rol_nivel,
            estado: 'Activo'
        };

        if (authUserId) {
            teacherData.id = authUserId;
        }

        const { error } = await supabaseClient.from('maestros').upsert(teacherData);
        if (error) {
            alert("Error al guardar en la tabla maestros: " + error.message);
        } else {
            alert("Maestro guardado con éxito.");
            closeTeacherModal();
            fetchMaestros();
        }
    }

    // Borrado lógico o físico del maestro
    async function deleteTeacher(id) {
        if (!confirm("¿Está seguro de eliminar este maestro?")) return;

        const { error } = await supabaseClient
            .from('maestros')
            .update({ estado: 'Inactivo' })
            .eq('id', id);

        if (error) {
            alert("Error al borrar: " + error.message);
        } else {
            alert("Maestro borrado con éxito.");
            fetchMaestros();
        }
    }
</script>
</body>
</html>
